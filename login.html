<!DOCTYPE html>
<html>
<head>
    <title>Skill Match - Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f5;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }
        .left {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 40px;
        }
        .logo .check {
            background: #245c35;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tag {
            color: #a33636;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 13px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            line-height: 1.1;
        }
        h1 span {
            color: #245c35;
        }
        p.desc {
            color: #555;
            font-size: 16px;
            max-width: 450px;
        }
        .right {
            flex: 1;
            background: #202b23;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
        }
        .right h2 {
            margin: 0 0 10px 0;
        }
        .right p {
            color: #aaa;
            margin-bottom: 30px;
        }
        label {
            font-size: 13px;
            letter-spacing: 1px;
            color: #ccc;
            display: block;
            margin-bottom: 6px;
            margin-top: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2a3b30;
            color: white;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 30px;
            background: #245c35;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #2e7344;
        }
        #error {
            color: #ff6b6b;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="left">
        <div class="logo">
            <div class="check">✓</div>
            Skill Match
        </div>
        <div class="tag">RESUME × JOB MATCHING</div>
        <h1>Match your <span>potential.</span></h1>
        <p class="desc">Understand what your resume already offers, discover missing skills, and prepare yourself for the job you want.</p>
    </div>

    <div class="right">
        <h2>Welcome back.</h2>
        <p>Sign in to continue to your Skill Match workspace.</p>

        <label>EMAIL</label>
        <input type="email" id="email" placeholder="Enter your email" value="test@example.com">

        <label>PASSWORD</label>
        <input type="password" id="password" placeholder="Enter your password" value="password123">

        <button onclick="login()">Sign In</button>
        <div id="error"></div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("http://127.0.0.1:5000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email: email, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = "dashboard2.html";
                } else {
                    document.getElementById("error").textContent = data.message || "Login failed";
                }
            } catch (err) {
                document.getElementById("error").textContent = "Could not reach server. Is Flask running?";
            }
        }
    </script>
</body>
</html>
